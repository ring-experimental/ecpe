# 웹 빌드를 만들어 GitHub Pages에 올린다.
# 러너는 이 저장소만 받는다. 게임 원본은 저장소에 없고 빌드에도 쓰이지 않는다(docs/provenance.md).
# 원본이 있어야만 빌드되는 것이 섞이면 이 워크플로가 실패한다.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ninja-build
          rustup target add wasm32-unknown-unknown
      - uses: mymindstorm/setup-emsdk@v14
      - name: 의존 라이브러리 캐시 (SDL3, FreeType, RmlUi)
        uses: actions/cache@v4
        with:
          path: native/build/deps
          key: deps-web-${{ runner.os }}-${{ hashFiles('native/deps.sh') }}
      - name: 빌드
        working-directory: native
        run: make -j4 web
      - name: 원본 파생물이 섞이지 않았는지 확인
        working-directory: native/build
        run: |
          ! ls tr.c codemap.json game 2>/dev/null | grep .
          ! find web -name 'client.bin*' -o -name '*.jar' -o -name 'illust_*' | grep .
          ls -la web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: native/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
